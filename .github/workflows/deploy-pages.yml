# Free hosting on GitHub Pages. Deploys on every push to main; can also be run by hand from
# the Actions tab ("Run workflow").
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Work out the base path
        id: paths
        # A repo named <user>.github.io is served at the domain root; any other repo is served
        # under /<repo>.
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          if [ "${repo,,}" = "${owner,,}.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner,,}.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${repo}" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner,,}.github.io/${repo}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.url }}
        run: npm run build
      # Jekyll would hide the _next/ folder; .nojekyll turns it off.
      - run: touch apps/shell/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/shell/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
